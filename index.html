<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte de Visite Étudiant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #2c3e50;
            --bg: #2c3e50;
            --text: #34495e;
            --light-gray: #f8f9fa;
            --accent: #3498db;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
        }

        .card {
            width: 380px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: scale(1.03);
        }

        .header-bg {
            height: 110px;
            background: var(--primary);
        }

        .photo-container {
            width: 115px;
            height: 115px;
            background: white;
            border-radius: 50%;
            margin: -60px auto 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .photo-container img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
        }

        .content {
            padding: 15px 30px 25px;
        }

        .identity {
            text-align: center;
            margin-bottom: 25px;
        }

        .identity h2 {
            margin: 10px 0 5px;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .identity p {
            margin: 0;
            color: #7f8c8d;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .section-title {
            font-size: 0.7rem;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .contact-info {
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text);
        }

        .info-item i {
            color: var(--primary);
            width: 25px;
            font-size: 0.9rem;
        }

        .expertise-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tag {
            background: #f1f3f5;
            color: var(--primary);
            padding: 5px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
        }

        /* BOUTON MODIFIÉ */
        .cv-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .cv-link:hover {
            background: var(--accent);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .social-links a {
            color: #bdc3c7;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            color: var(--primary);
            transform: translateY(-3px);
        }

    </style>
</head>
<body>

<div class="card">
    <div class="header-bg"></div>

    <div class="photo-container">
        <img src="https://new.express.adobe.com/webpage/TsLCb6f4qSFm9/resources/12698685-0282-423d-9a2b-ee50758fb853-img_5165_jpe?asset_id=27f41b39-a1e3-42d4-b1d2-f637a9bcea0a&img_etag=%2225d55fa965a34515ab03a92c42bc6e3b%22&image_assets=false&size=1024" alt="Photo de profil">
    </div>

    <div class="content">
        <div class="identity">
            <h2>Chiron Louis</h2>
            <p>Étudiant en STI2D</p>
        </div>

        <div class="section-title">Coordonnées</div>
        <div class="contact-info">
            <div class="info-item">
                <i class="fas fa-envelope"></i> lchiron@outlook.com
            </div>
            <div class="info-item">
                <i class="fas fa-phone"></i> +33 6 76 82 38 05
            </div>
        </div>

        <div class="section-title">competences</div>
        <div class="expertise-tags">
            <span class="tag">Production vidéos</span>
            <span class="tag">Concepteur web</span>
            <span class="tag">Production photos</span>
            <span class="tag">Graphiste</span>
        </div>

        <a href="https://new.express.adobe.com/webpage/TsLCb6f4qSFm9/resources/82f08a2e-46d5-4cf4-b641-48a2b9d680a1-img_5160_jpe?asset_id=1560a195-59a5-46c5-aeba-77c1e38d2510&img_etag=%22ef2ad5e47c1a48ab8629ea82614823ac%22&image_assets=false&size=1024" target="_blank" class="cv-link">
            <i class="fas fa-eye"></i> Voir mon CV
        </a>

        <div class="social-links">
            <a href="https://www.instagram.com/i_got_it_picture/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://fr.linkedin.com/in/louis-chiron-6b1ab6296" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.youtube.com/channel/UC_sBheo_TxHa7WUK301RWgg" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://chiron-site.github.io/Portfolio-accueil-Louis-Chiron/" target="_blank"><i class="fas fa-globe"></i></a>
        </div>
    </div>
</div>

</body>
</html>
